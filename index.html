<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="mainpage">
        <div id="statusDiv">
            <div class="titleDiv">
                <h2>Status</h2>
            </div>
            <div id="playerStatus"></div>
        </div>
        <div id="middleDiv">
            <div class="titleDiv">
                <h1 id="gameTitle">'placeholder'</h1>
            </div>
            <div id="info">
                <p id="firstImpression"></p>
            </div>
            <div id="input">
                <input type="text" id="textField">
                <button type="button" id="actionButton">Enter</button>
            </div>
            <div>
                <p>Move using n, e, s, w</p>
                <p>Other words: look, take, equip, fight, talk</p>
                <p>In a fight, attack with a. In a conversation, choose with numbers</p>
                <p>The game is not finished but what is here is playable</p>
                <p>Just refresh the page to restart the game</p>
            </div>
        </div>
        <div id="objectiveDiv">
            <div id="objectives"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
